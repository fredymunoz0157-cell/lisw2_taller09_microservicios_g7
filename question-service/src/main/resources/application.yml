server:
  port: 8083

spring:
  application:
    name: question-service
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASS:guest}

services:
  validation:
    url: ${VALIDATION_SERVICE_URL:http://localhost:8082}
  lifecycle:
    url: ${LIFECYCLE_SERVICE_URL:http://localhost:8084}
